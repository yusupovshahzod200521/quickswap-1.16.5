name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.4.2
          arguments: build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: quickswap-1.16.5
          path: build/libs/*.jar
